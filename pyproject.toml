[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threadstudio"
version = "2.0.0"
description = "High-throughput multi-threaded Threads comment video studio built with Fluent Blue (PyQt6)"
readme = "PRODUCT.md"
requires-python = ">=3.10"
dependencies = [
    "fluent-blue[pyqt6]>=0.2.0",
    "capcut-tts-api>=1.5.0",
    "edge-tts>=6.1.0",
    "playwright>=1.40.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
]

[project.scripts]
threadstudio = "threadstudio.app:main"

[tool.setuptools.packages.find]
where = ["src"]
